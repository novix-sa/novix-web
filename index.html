<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novix</title>
  <meta name="description" content="Novix: nuevo sitio en construcción.">
  <style>
    :root { --bg: #0f1b2d; --fg: #f4f6fa; --muted: #9fb0c8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 .25em; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 1.125rem; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Novix</h1>
    <p>Estamos construyendo nuestro nuevo sitio.</p>
  </main>
</body>
</html>
